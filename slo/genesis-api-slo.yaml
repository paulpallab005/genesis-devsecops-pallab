## Alert Configuration

alerts:
  - name: high_burn_rate
    condition: burn_rate >= 5 for 15 minutes
    action: Page on-call via SNS -> PagerDuty
    runbook: docs/runbooks/high-burn-rate.md
  
  - name: budget_50_percent
    condition: error_budget_consumed >= 50%
    action: Slack notification to #ops-alerts
    runbook: docs/runbooks/error-budget-review.md
  
  - name: budget_75_percent
    condition: error_budget_consumed >= 75%
    action: Page on-call, Slack #incident-response
    runbook: docs/runbooks/error-budget-escalation.md

## Notes

- **SLI Measurement Window**: Calculated every 5 minutes using CloudWatch metric math
- **Grace Period**: First 7 days after deployment excluded from SLO (burn-in period)
- **Maintenance Windows**: Scheduled maintenance (off-hours, announced) excluded from SLO
- **External Dependencies**: AWS Lambda platform availability not excluded (within our control to architect around)
- **Traffic Requirements**: SLO valid only when traffic ≥10 requests/hour (avoid noise from low traffic)

