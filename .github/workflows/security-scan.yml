name: Security Scan (Reusable Workflow)

on:
  workflow_call:
    inputs:
      coverage_threshold:
        description: 'Minimum test coverage percentage'
        required: false
        type: number
        default: 75
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.11'

jobs:
  # Stage 1: Secret Scanning
  secret-scanning:
    name: "Stage 1: Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2: Dependency Audit
  dependency-audit:
    name: "Stage 2: Dependency Audit"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Create Reports Directory
        run: mkdir -p reports  # Fix: Ensure directory exists

      - name: Run pip-audit (JSON report)
        working-directory: app
        run: pip-audit --requirement requirements.txt --format json --output ../reports/pip-audit.json
        continue-on-error: true

      - name: Run pip-audit (console output)
        working-directory: app
        run: pip-audit --requirement requirements.txt

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: reports/pip-audit.json
          retention-days: 30

  # Stage 3: SAST with Semgrep
  sast:
    name: "Stage 3: SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: dependency-audit
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
          generateSarif: "1" # Fix: Use "1" for older action compatibility

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4 # Fix: Updated to v4
        with:
          sarif_file: semgrep.sarif
        if: always()

  # Stage 4: Unit Tests + Coverage
  tests-and-coverage:
    name: "Stage 4: Unit Tests + Coverage"
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        working-directory: app
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov # Ensure test tools are present

      - name: Run tests with coverage
        working-directory: app
        run: pytest --cov=. --cov-report=xml:coverage.xml --cov-report=term -v

      - name: Check coverage threshold
        working-directory: app
        run: |
          # Robust coverage check using python
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib['line-rate']) * 100
          print(f'Coverage: {line_rate}%')
          if line_rate < ${{ inputs.coverage_threshold }}:
              print('❌ Below threshold')
              exit(1)
          "

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage.xml
          retention-days: 30