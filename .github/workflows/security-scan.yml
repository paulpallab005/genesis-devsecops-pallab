name: Security Scan (Reusable Workflow)

# Reusable workflow for security scanning (Stages 1-4)
# Called by ci.yml to demonstrate platform engineering pattern
# where security standards are shared across multiple repositories

on:
  workflow_call:
    inputs:
      coverage_threshold:
        description: 'Minimum test coverage percentage'
        required: false
        type: number
        default: 75
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.11'

jobs:
  # Stage 1: Secret Scanning with Gitleaks
  secret-scanning:
    name: "Stage 1: Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for Gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional: for Gitleaks Pro

  # Stage 2: Dependency Audit
  dependency-audit:
    name: "Stage 2: Dependency Audit"
    runs-on: ubuntu-latest
    needs: secret-scanning  # Fail-fast: only run if secrets check passes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (JSON report)
        working-directory: app
        run: pip-audit --requirement requirements.txt --format json --output ../reports/pip-audit.json
        continue-on-error: true

      - name: Run pip-audit (console output)
        working-directory: app
        run: pip-audit --requirement requirements.txt

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: reports/pip-audit.json
          retention-days: 30

  # Stage 3: SAST with Semgrep
  sast:
    name: "Stage 3: SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: dependency-audit  # Sequential dependency
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto  # Auto-detect rules based on language
          generateSarif: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

  # Stage 4: Unit Tests + Coverage
  tests-and-coverage:
    name: "Stage 4: Unit Tests + Coverage"
    runs-on: ubuntu-latest
    needs: sast  # Sequential dependency
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        working-directory: app
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: app
        run: pytest --cov=. --cov-report=term --cov-report=xml --cov-report=html -v

      - name: Check coverage threshold
        working-directory: app
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.attrib['line-rate']) * 100)")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < ${{ inputs.coverage_threshold }}" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below threshold ${{ inputs.coverage_threshold }}%"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets threshold ${{ inputs.coverage_threshold }}%"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/htmlcov/
          retention-days: 30

      - name: Generate coverage badge
        working-directory: app
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(int(float(root.attrib['line-rate']) * 100))")
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
          echo "Coverage: $COVERAGE%"
